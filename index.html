<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drives & Dinks</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><small>ARCADE PICKLEBALL</small><h1>DRIVES <span>&</span> DINKS</h1></div><button id="mode">MODE: PLAY</button></header><div class="game"><canvas id="court" width="960" height="600" aria-label="Pickleball court"></canvas><div id="overlay" role="status" aria-live="polite"></div></div><section class="controls"><div><strong>SHOT</strong><div id="shots"><button data-shot="drive">1 DRIVE</button><button data-shot="drop">2 DROP</button><button data-shot="dink">3 DINK</button><button data-shot="lob">4 LOB</button></div></div><div class="tip"><strong>HOW TO PLAY</strong><p>Players move automatically. Move the cyan target left or right with mouse, touch, or ← →. Press SPACE or tap HIT when the ball is near you. On touchscreens, drag the court to aim.</p></div><button id="hit" class="hit">HIT <small>SPACE</small></button></section><footer>First to 11 · win by 2 · side-out scoring <button id="restart">NEW GAME</button></footer></main><script type="module" src="src/main.js"></script></body></html>
