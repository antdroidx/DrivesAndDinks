name: Deploy Drives & Dinks dev build to GitHub Pages

on:
  push:
    branches:
      - codex/high-resolution-players
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test dev source
        run: node --test

      - name: Prepare dev-only site
        run: |
          mkdir -p _site/dev
          cp index.html style.css studio.html studio.css _site/dev/
          printf 'globalThis.DRIVES_DINKS_BUILD = "%s";\n' "${{ github.run_number }}" > _site/dev/build-info.js
          cp -R src assets _site/dev/
          node scripts/version-build.js "${{ github.run_number }}" _site/dev

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0; url=./dev/">
            <title>Drives &amp; Dinks Dev</title>
          </head>
          <body>
            <p><a href="./dev/">Open the Drives &amp; Dinks development build</a></p>
            <script>location.replace('./dev/');</script>
          </body>
          </html>
          HTML

          touch _site/.nojekyll

      - name: Publish dev build
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: Deploy dev build ${{ github.run_number }}
