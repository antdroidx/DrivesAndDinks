name: Deploy Drives & Dinks dev build to GitHub Pages

on:
  push:
    branches:
      - codex/high-resolution-players
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out frozen public release
        uses: actions/checkout@v4
        with:
          ref: ce59a6af09c78309ac30c7c3f7d362fd6c370dc8
          path: _public

      - name: Test dev source
        run: node --test

      - name: Prepare public release and dev site
        run: |
          mkdir -p _site
          rsync -a --exclude=.git --exclude=dev --exclude=preview _public/ _site/

          mkdir -p _site/dev
          cp index.html style.css studio.html studio.css _site/dev/
          printf 'globalThis.DRIVES_DINKS_BUILD = "%s";\n' "${{ github.run_number }}" > _site/dev/build-info.js
          cp -R src assets _site/dev/
          node scripts/version-build.js "${{ github.run_number }}" _site/dev

          touch _site/.nojekyll

      - name: Publish public release and dev build
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: Deploy dev build ${{ github.run_number }}
