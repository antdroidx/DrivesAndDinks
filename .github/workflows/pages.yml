name: Deploy public prototype and development build

on:
  push:
    branches:
      - main
      - codex/high-resolution-players
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check out frozen Build 15
        uses: actions/checkout@v4
        with:
          ref: ce59a6af09c78309ac30c7c3f7d362fd6c370dc8
          path: _archive15
      - name: Check out public playable prototype
        uses: actions/checkout@v4
        with:
          ref: dd6eae74fc3ae3a32c2d2a15cb27a27e4629124e
          path: _prototype
      - name: Test source
        run: node --test
      - name: Package public prototype, archive and dev
        run: |
          mkdir -p _site/archive/build-15 _site/prototype _site/dev
          rsync -a --exclude=.git --exclude=dev --exclude=preview _archive15/ _site/archive/build-15/
          cp _prototype/index.html _prototype/style.css _prototype/studio.html _prototype/studio.css _site/
          cp -R _prototype/src _prototype/assets _site/
          cp sw.js _site/
          printf 'globalThis.DRIVES_DINKS_BUILD = "48";\n' > _site/build-info.js
          node scripts/version-build.js 48 _site
          cp -R _site/index.html _site/style.css _site/studio.html _site/studio.css _site/build-info.js _site/src _site/assets _site/prototype/
          cp index.html style.css studio.html studio.css _site/dev/
          printf 'globalThis.DRIVES_DINKS_BUILD = "%s";\n' "${{ github.run_number }}" > _site/dev/build-info.js
          cp -R src assets _site/dev/
          node scripts/version-build.js "${{ github.run_number }}" _site/dev
          touch _site/.nojekyll
      - name: Publish GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: Publish prototype, Build 15 archive and dev ${{ github.run_number }}
