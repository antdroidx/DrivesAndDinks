name: Deploy Drives & Dinks to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out friends testing build
        uses: actions/checkout@v4
        with:
          ref: friends-build-15
          path: _friends

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp _friends/index.html _friends/style.css _site/
          printf 'globalThis.DRIVES_DINKS_BUILD = "15";\n' > _site/build-info.js
          cp -R _friends/src _friends/assets _site/
          node scripts/version-build.js 15 _site

          mkdir -p _site/dev
          cp index.html style.css _site/dev/
          printf 'globalThis.DRIVES_DINKS_BUILD = "%s";\n' "${{ github.run_number }}" > _site/dev/build-info.js
          cp -R src assets _site/dev/
          node scripts/version-build.js "${{ github.run_number }}" _site/dev

          touch _site/.nojekyll

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: Deploy ${{ github.sha }}
